spring.application.name=log-data-pusher

# Explicitly import external environment configuration files
spring.config.import=optional:file:./db-config.env[.properties],optional:file:./snowflake-config.env[.properties]

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aji_log_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Automatically creates the 'ingestion_checkpoints' table and updates existing structures safely
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Snowflake Snowpipe Streaming Configuration
snowflake.streaming.account=${SNOWFLAKE_ACCOUNT:}
snowflake.streaming.user=${SNOWFLAKE_USER:AJI_LOG_PUSHER_SNOWFLAKE_USER}
snowflake.streaming.role=${SNOWFLAKE_ROLE:ACCOUNTADMIN}
snowflake.streaming.warehouse=${SNOWFLAKE_WAREHOUSE:LOG_ANALYTICS_WH}
snowflake.streaming.database=${SNOWFLAKE_DATABASE:LOG_ANALYTICS_DB}
snowflake.streaming.schema=${SNOWFLAKE_SCHEMA:BRONZE}
snowflake.streaming.log-records-table=${SNOWFLAKE_LOG_RECORDS_TABLE:LOG_RECORDS}
snowflake.streaming.incidents-table=${SNOWFLAKE_INCIDENTS_TABLE:INCIDENTS}
snowflake.streaming.private-key-path=${SNOWFLAKE_PRIVATE_KEY_PATH:}
snowflake.streaming.private-key=${SNOWFLAKE_PRIVATE_KEY:}
snowflake.streaming.private-key-passphrase=${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:}

# Ingestion Pipeline Tuning
ingestion.scheduler.enabled=${INGESTION_SCHEDULER_ENABLED:true}
ingestion.scheduler.fixed-delay-ms=${INGESTION_SCHEDULER_INTERVAL_MS:300000}
ingestion.batch-size=${INGESTION_BATCH_SIZE:500}
ingestion.incidents.overlap-minutes=${INCIDENTS_OVERLAP_MINUTES:5}
ingestion.commit-timeout-seconds=${INGESTION_COMMIT_TIMEOUT_SECONDS:30}
ingestion.max-retries=${INGESTION_MAX_RETRIES:3}

# Logging
logging.level.com.aji.logpusher=INFO
logging.level.net.snowflake.ingest=WARN
logging.level.org.springframework=INFO

